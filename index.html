<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Face Pong: Гипер-Лицо</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Face Pong">
  <meta name="theme-color" content="#0a0c16">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0c16;
      font-family: 'Impact', 'Arial Black', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* 16:9 ratio */
      max-height: 56.25vw;
      background: #0a0c16;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Сенсорный интерфейс настроек вверху/внизу */
    .touch-ui {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(14, 18, 30, 0.85);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      z-index: 10;
      max-width: 96%;
      overflow-x: auto;
    }
    .btn {
      background: rgba(30, 40, 65, 0.8);
      color: #fff;
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 5px 10px;
      font-size: 13px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn:active, .btn.active {
      background: #00f0ff;
      color: #000;
      transform: scale(0.96);
    }
    .btn-god {
      border-color: #b446ff;
      color: #ff3c5a;
    }
    .btn-god.active {
      background: #b446ff;
      color: #fff;
      box-shadow: 0 0 15px #b446ff;
    }
    .rally-control {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffd700;
      font-size: 12px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      padding: 0 6px;
    }
    .btn-sm {
      padding: 3px 8px;
      font-size: 14px;
      border-radius: 8px;
    }
    /* Подсказка для добавления на рабочий стол */
    #install-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 240, 255, 0.95);
      color: #000;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 13px;
      display: none;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.6);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="install-banner">📱 Нажмите сюда, чтобы добавить Face Pong на рабочий стол!</div>
    <canvas id="canvas" width="1920" height="1080"></canvas>

    <!-- Мобильные кнопки переключения сложности и старта ралли прямо на экране -->
    <div class="touch-ui">
      <div class="rally-control">
        <span>СТАРТ:</span>
        <button class="btn btn-sm" id="btn-rally-minus">-</button>
        <span id="txt-start-rally" style="min-width: 18px; text-align: center;">0</span>
        <button class="btn btn-sm" id="btn-rally-plus">+</button>
      </div>
      <button class="btn" id="btn-easy">Лёгкий</button>
      <button class="btn active" id="btn-normal">Средний</button>
      <button class="btn" id="btn-hard">Сложный</button>
      <button class="btn" id="btn-expert">Эксперт</button>
      <button class="btn btn-god" id="btn-god">⚡ БОГ (Беск.)</button>
      <button class="btn" id="btn-fs" style="border-color: #ffd700; color: #ffd700;">⛶</button>
    </div>
  </div>

  <script>
    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }

    // Обработка баннера установки на рабочий стол
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'block';
    });
    installBanner.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          installBanner.style.display = 'none';
        });
      }
    });

    // -------------------------------------------------------------
    // ПРОЦЕДУРНЫЙ ЗВУКОВОЙ ДВИЖОК (WEB AUDIO API)
    // -------------------------------------------------------------
    class WebSoundEngine {
      constructor() {
        this.ctx = null;
        this.musicPlaying = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.startMusic();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playHitPlayer() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playHitAi() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(440.0, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playWall() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);
      }
      playGoal() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
        if (navigator.vibrate) navigator.vibrate([40, 30, 80]);
      }
      playWhoosh() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
      startMusic() {
        if (this.musicPlaying || !this.ctx) return;
        this.musicPlaying = true;
        const bpm = 138;
        const beatSec = 60.0 / bpm;
        const bassNotes = [110, 110, 130.8, 146.8, 87.3, 87.3, 98.0, 110];
        let step = 0;
        setInterval(() => {
          if (!this.ctx || this.ctx.state !== 'running') return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = bassNotes[step % bassNotes.length];
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + beatSec * 0.8);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + beatSec * 0.8);
          step++;
        }, beatSec * 500);
      }
    }

    const sound = new WebSoundEngine();

    // -------------------------------------------------------------
    // ИГРОВОЙ ДВИЖОК CANVAS (1920x1080)
    // -------------------------------------------------------------
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const CW = 1920;
    const CH = 1080;
    const TOP_WALL = 135;
    const BOTTOM_WALL = 955;
    const PADDLE_W = 38;
    const PADDLE_H = 180;
    const BALL_BASE_W = 66;
    const BALL_BASE_H = 118;
    const BALL_RAD = BALL_BASE_W * 0.42;
    const INITIAL_SPEED = 580;
    const SPEED_MULT = 1.075;
    const MAX_SPEED = 3400;

    // Загрузка спрайта лица
    const faceImg = new Image();
    faceImg.src = 'face.png';

    let state = 'START';
    let scoreP1 = 0;
    let scoreP2 = 0;
    let rallyCount = 0;
    let startRally = 0;
    let maxRally = 0;
    let maxSpeed = 0;
    let screenShake = 0;
    let aiDifficulty = 'normal';

    const p1 = { x: 70, y: 540, hitFlash: 0 };
    const p2 = { x: CW - 70, y: 540, aiSpeed: 600, hitFlash: 0 };
    const ball = {
      x: CW / 2,
      y: CH / 2,
      vx: 0,
      vy: 0,
      speed: INITIAL_SPEED,
      rot: 0,
      rotSpeed: 0,
      squashX: 1,
      squashY: 1,
      trail: []
    };

    let particles = [];
    let floatingTexts = [];
    let aiOffset = 0;
    let countdownTimer = 0;

    function resetBall(direction = 1) {
      ball.x = CW / 2;
      ball.y = TOP_WALL + 150 + Math.random() * (BOTTOM_WALL - TOP_WALL - 300);
      ball.speed = Math.min(MAX_SPEED, INITIAL_SPEED * Math.pow(SPEED_MULT, startRally));
      const ang = (Math.random() - 0.5) * 0.7;
      ball.vx = direction * ball.speed * Math.cos(ang);
      ball.vy = ball.speed * Math.sin(ang);
      ball.rot = 0;
      ball.rotSpeed = 0;
      ball.squashX = 1;
      ball.squashY = 1;
      ball.trail = [];
      rallyCount = startRally;
    }

    function startNewPoint(scorer) {
      state = 'POINT_SCORED';
      countdownTimer = 1.0;
      resetBall(scorer === 1 ? 1 : -1);
    }

    function startMatch() {
      scoreP1 = 0;
      scoreP2 = 0;
      rallyCount = startRally;
      maxSpeed = 0;
      p1.y = 540;
      p2.y = 540;
      startNewPoint(Math.random() < 0.5 ? 1 : 2);
    }

    // -------------------------------------------------------------
    // СЕНСОРНОЕ УПРАВЛЕНИЕ ДЛЯ ТЕЛЕФОНА
    // -------------------------------------------------------------
    function handleTouchMove(e) {
      sound.init();
      if (state === 'START' || state === 'GAMEOVER') {
        state = 'PLAYING';
        startMatch();
        return;
      }
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const scaleY = CH / rect.height;
      const clientY = (touch.clientY - rect.top) * scaleY;
      const halfH = PADDLE_H / 2;
      p1.y = Math.max(TOP_WALL + halfH, Math.min(BOTTOM_WALL - halfH, clientY));
    }

    window.addEventListener('touchstart', handleTouchMove, { passive: false });
    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handleTouchMove(e);
    }, { passive: false });

    // Управление мышью (для ПК в браузере)
    window.addEventListener('mousemove', (e) => {
      if (state !== 'PLAYING') return;
      const rect = canvas.getBoundingClientRect();
      const scaleY = CH / rect.height;
      const clientY = (e.clientY - rect.top) * scaleY;
      const halfH = PADDLE_H / 2;
      p1.y = Math.max(TOP_WALL + halfH, Math.min(BOTTOM_WALL - halfH, clientY));
    });
    window.addEventListener('click', () => {
      sound.init();
      if (state === 'START' || state === 'GAMEOVER') {
        state = 'PLAYING';
        startMatch();
      }
    });

    // Кнопки интерфейса
    function setActiveDiffBtn(id) {
      document.querySelectorAll('.touch-ui .btn').forEach(b => {
        if (b.id !== 'btn-rally-minus' && b.id !== 'btn-rally-plus' && b.id !== 'btn-fs') {
          b.classList.remove('active');
        }
      });
      document.getElementById(id).classList.add('active');
    }

    document.getElementById('btn-easy').onclick = (e) => {
      e.stopPropagation();
      sound.init();
      aiDifficulty = 'easy';
      setActiveDiffBtn('btn-easy');
    };
    document.getElementById('btn-normal').onclick = (e) => {
      e.stopPropagation();
      sound.init();
      aiDifficulty = 'normal';
      setActiveDiffBtn('btn-normal');
    };
    document.getElementById('btn-hard').onclick = (e) => {
      e.stopPropagation();
      sound.init();
      aiDifficulty = 'hard';
      setActiveDiffBtn('btn-hard');
    };
    document.getElementById('btn-expert').onclick = (e) => {
      e.stopPropagation();
      sound.init();
      aiDifficulty = 'expert';
      setActiveDiffBtn('btn-expert');
    };
    document.getElementById('btn-god').onclick = (e) => {
      e.stopPropagation();
      sound.init();
      aiDifficulty = 'god';
      setActiveDiffBtn('btn-god');
      screenShake = 16;
      sound.playWhoosh();
    };

    const txtRally = document.getElementById('txt-start-rally');
    document.getElementById('btn-rally-minus').onclick = (e) => {
      e.stopPropagation();
      sound.init();
      startRally = Math.max(0, startRally - 5);
      txtRally.innerText = startRally;
      if (state === 'PLAYING') resetBall(Math.sign(ball.vx) || 1);
    };
    document.getElementById('btn-rally-plus').onclick = (e) => {
      e.stopPropagation();
      sound.init();
      startRally = Math.min(25, startRally + 5);
      txtRally.innerText = startRally;
      if (state === 'PLAYING') resetBall(Math.sign(ball.vx) || 1);
    };
    document.getElementById('btn-fs').onclick = (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // -------------------------------------------------------------
    // ФИЗИКА И ОБНОВЛЕНИЕ
    // -------------------------------------------------------------
    let lastTime = performance.now();

    function update() {
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 25);

      // Обновление частиц
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 300 * dt;
        p.rot += p.rotSpeed * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (state === 'POINT_SCORED') {
        countdownTimer -= dt;
        if (countdownTimer <= 0) state = 'PLAYING';
      }

      if (state === 'PLAYING') {
        // ОБНОВЛЕНИЕ БОТА
        const midY = (TOP_WALL + BOTTOM_WALL) / 2;
        if (aiDifficulty === 'god') {
          // РЕЖИМ БОГА: Бесконечная скорость
          p2.aiSpeed = 999999;
          p2.y = ball.y;
        } else {
          let reactX = 0.35;
          if (aiDifficulty === 'easy') { p2.aiSpeed = 420; reactX = 0.45; }
          else if (aiDifficulty === 'normal') { p2.aiSpeed = 600; reactX = 0.35; }
          else if (aiDifficulty === 'hard') { p2.aiSpeed = 820; reactX = 0.22; }
          else if (aiDifficulty === 'expert') { p2.aiSpeed = 1250; reactX = 0.12; }

          if (ball.vx < 0) {
            // Мяч летит к игроку: возврат к центру
            const diff = midY - p2.y;
            p2.y += Math.sign(diff) * Math.min(Math.abs(diff), 280 * dt);
          } else {
            if (ball.x > CW * reactX) {
              const target = ball.y + aiOffset;
              const diff = target - p2.y;
              p2.y += Math.sign(diff) * Math.min(Math.abs(diff), p2.aiSpeed * dt);
            }
          }
        }
        const halfH = PADDLE_H / 2;
        p2.y = Math.max(TOP_WALL + halfH, Math.min(BOTTOM_WALL - halfH, p2.y));

        // НЕПРЕРЫВНАЯ ФИЗИКА МЯЧА (SUB-STEPPING)
        ball.speed = Math.min(MAX_SPEED, ball.speed + 12 * dt);
        const norm = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = (ball.vx / norm) * ball.speed;
        ball.vy = (ball.vy / norm) * ball.speed;

        if (ball.speed > maxSpeed) maxSpeed = Math.floor(ball.speed);

        const stepSize = 6.0;
        const totalDist = ball.speed * dt;
        const numSteps = Math.max(3, Math.ceil(totalDist / stepSize));
        const subDt = dt / numSteps;

        const p1Left = p1.x - PADDLE_W / 2;
        const p1Right = p1.x + PADDLE_W / 2;
        const p2Left = p2.x - PADDLE_W / 2;
        const p2Right = p2.x + PADDLE_W / 2;

        for (let s = 0; s < numSteps; s++) {
          const oldX = ball.x;
          ball.x += ball.vx * subDt;
          ball.y += ball.vy * subDt;

          // Стены
          if (ball.y - BALL_RAD <= TOP_WALL && ball.vy < 0) {
            ball.y = TOP_WALL + BALL_RAD;
            ball.vy = Math.abs(ball.vy);
            sound.playWall();
            screenShake = Math.max(screenShake, 3);
          } else if (ball.y + BALL_RAD >= BOTTOM_WALL && ball.vy > 0) {
            ball.y = BOTTOM_WALL - BALL_RAD;
            ball.vy = -Math.abs(ball.vy);
            sound.playWall();
            screenShake = Math.max(screenShake, 3);
          }

          // Ракетка 1 (Игрок)
          if (ball.vx < 0) {
            const impactPlane = p1Right + BALL_RAD;
            if (oldX >= p1Left && ball.x <= impactPlane) {
              const margin = BALL_RAD * 0.75;
              if (ball.y >= p1.y - halfH - margin && ball.y <= p1.y + halfH + margin) {
                ball.x = impactPlane;
                handleBounce(p1, true);
                break;
              }
            }
          }
          // Ракетка 2 (Бот)
          else if (ball.vx > 0) {
            const impactPlane = p2Left - BALL_RAD;
            if (oldX <= p2Right && ball.x >= impactPlane) {
              const margin = BALL_RAD * 0.75;
              if (ball.y >= p2.y - halfH - margin && ball.y <= p2.y + halfH + margin) {
                ball.x = impactPlane;
                handleBounce(p2, false);
                break;
              }
            }
          }

          // Голы
          if (ball.x < 0) {
            handleGoal(2);
            break;
          } else if (ball.x > CW) {
            handleGoal(1);
            break;
          }
        }

        // Шлейф и анимация
        ball.rot += ball.rotSpeed * dt;
        ball.rotSpeed *= 0.98;
        ball.trail.push({ x: ball.x, y: ball.y, rot: ball.rot, alpha: 0.7 });
        for (let t of ball.trail) t.alpha -= dt * 3.5;
        ball.trail = ball.trail.filter(t => t.alpha > 0);
      }

      draw();
      requestAnimationFrame(update);
    }

    function handleBounce(paddle, isPlayer) {
      ball.speed = Math.min(MAX_SPEED, ball.speed * SPEED_MULT);
      rallyCount++;
      if (rallyCount > maxRally) maxRally = rallyCount;

      const offset = Math.max(-1, Math.min(1, (ball.y - paddle.y) / (PADDLE_H / 2)));
      const ang = offset * (Math.PI / 3);
      const sign = isPlayer ? 1 : -1;
      ball.vx = sign * ball.speed * Math.cos(ang);
      ball.vy = ball.speed * Math.sin(ang);
      ball.rotSpeed = offset * 900;
      paddle.hitFlash = 0.15;

      if (isPlayer) {
        sound.playHitPlayer();
        if (navigator.vibrate) navigator.vibrate(18);
        if (aiDifficulty === 'god') aiOffset = 0;
        else if (aiDifficulty === 'expert') aiOffset = (Math.random() - 0.5) * 20;
        else if (aiDifficulty === 'hard') aiOffset = (Math.random() - 0.5) * 45;
        else aiOffset = (Math.random() - 0.5) * 80;
      } else {
        sound.playHitAi();
      }
      screenShake = Math.max(screenShake, 5 + ball.speed / 400);
    }

    function handleGoal(scorer) {
      sound.playGoal();
      screenShake = 22;
      rallyCount = startRally;

      const gx = scorer === 1 ? CW : 0;
      for (let i = 0; i < 30; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 150 + Math.random() * 450;
        particles.push({
          x: gx, y: ball.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 800,
          life: 1.0,
          decay: 1.2 + Math.random() * 1.5
        });
      }

      if (scorer === 1) scoreP1++;
      else scoreP2++;

      if (scoreP1 >= 11 || scoreP2 >= 11) {
        state = 'GAMEOVER';
      } else {
        startNewPoint(scorer);
      }
    }

    // -------------------------------------------------------------
    // ОТРИСОВКА (CANVAS 1920x1080)
    // -------------------------------------------------------------
    function draw() {
      ctx.save();
      if (screenShake > 0) {
        const ox = (Math.random() - 0.5) * screenShake * 2;
        const oy = (Math.random() - 0.5) * screenShake * 2;
        ctx.translate(ox, oy);
      }

      // Фон
      ctx.fillStyle = '#0a0c16';
      ctx.fillRect(0, 0, CW, CH);

      // Фоновые гигантские лица
      ctx.globalAlpha = 0.08;
      if (faceImg.complete) {
        for (let i = 0; i < 4; i++) {
          ctx.drawImage(faceImg, 220 + i * 440 - 120, CH / 2 - 210, 240, 420);
        }
      }
      ctx.globalAlpha = 1.0;

      // Трибуны зрителей-лиц
      const time = performance.now() / 200;
      const numSpec = 34;
      for (let i = 0; i < numSpec; i++) {
        const sx = 45 + i * ((CW - 90) / (numSpec - 1));
        const bob = Math.sin(time + i * 0.4) * 5;
        if (faceImg.complete) {
          ctx.drawImage(faceImg, sx - 15, 105 + bob - 26, 30, 52);
          ctx.drawImage(faceImg, sx - 15, 985 - bob - 26, 30, 52);
        }
      }

      // Границы поля
      ctx.strokeStyle = '#3c5078';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, TOP_WALL);
      ctx.lineTo(CW, TOP_WALL);
      ctx.moveTo(0, BOTTOM_WALL);
      ctx.lineTo(CW, BOTTOM_WALL);
      ctx.stroke();

      // Сетка по центру
      for (let i = 0; i < 16; i++) {
        const ny = TOP_WALL + 30 + i * ((BOTTOM_WALL - TOP_WALL - 60) / 15);
        if (faceImg.complete) {
          ctx.drawImage(faceImg, CW / 2 - 11, ny - 19, 22, 38);
        }
      }

      // РАКЕТКА 1 (Игрок - Голубая)
      ctx.save();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 4;
      ctx.fillStyle = '#142036';
      ctx.strokeRect(p1.x - PADDLE_W / 2, p1.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
      ctx.fillRect(p1.x - PADDLE_W / 2, p1.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
      if (faceImg.complete) {
        ctx.drawImage(faceImg, p1.x - PADDLE_W / 2, p1.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
      }
      ctx.restore();

      // РАКЕТКА 2 (Бот - Красная / Аура Бога)
      ctx.save();
      if (aiDifficulty === 'god') {
        ctx.fillStyle = 'rgba(180, 70, 255, 0.4)';
        ctx.fillRect(p2.x - PADDLE_W / 2 - 8, p2.y - PADDLE_H / 2 - 8, PADDLE_W + 16, PADDLE_H + 16);
      }
      ctx.strokeStyle = aiDifficulty === 'god' ? '#b446ff' : '#ff3c5a';
      ctx.lineWidth = 4;
      ctx.fillStyle = '#281420';
      ctx.strokeRect(p2.x - PADDLE_W / 2, p2.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
      ctx.fillRect(p2.x - PADDLE_W / 2, p2.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
      if (faceImg.complete) {
        ctx.drawImage(faceImg, p2.x - PADDLE_W / 2, p2.y - PADDLE_H / 2, PADDLE_W, PADDLE_H);
      }
      ctx.restore();

      // МЯЧ И ШЛЕЙФ
      if (state === 'PLAYING' || state === 'POINT_SCORED') {
        for (let t of ball.trail) {
          ctx.save();
          ctx.globalAlpha = t.alpha * 0.5;
          ctx.translate(t.x, t.y);
          ctx.rotate(t.rot * Math.PI / 180);
          if (faceImg.complete) ctx.drawImage(faceImg, -BALL_BASE_W / 2, -BALL_BASE_H / 2, BALL_BASE_W, BALL_BASE_H);
          ctx.restore();
        }

        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.rotate(ball.rot * Math.PI / 180);
        if (faceImg.complete) {
          ctx.drawImage(faceImg, -BALL_BASE_W / 2, -BALL_BASE_H / 2, BALL_BASE_W, BALL_BASE_H);
        }
        if (ball.speed >= 1400) {
          ctx.strokeStyle = '#ff3c5a';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(0, 0, BALL_RAD + 6, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Частицы
      for (let p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        if (faceImg.complete) ctx.drawImage(faceImg, -8, -14, 16, 28);
        ctx.restore();
      }

      // ВЕРХНЕЕ ТАБЛО
      ctx.fillStyle = 'rgba(14, 18, 30, 0.9)';
      ctx.fillRect(0, 0, CW, 80);

      ctx.font = '84px Impact';
      ctx.fillStyle = '#00f0ff';
      ctx.fillText(scoreP1, CW / 2 - 240, 68);

      ctx.fillStyle = '#ff3c5a';
      ctx.fillText(scoreP2, CW / 2 + 180, 68);

      ctx.font = '28px Impact';
      ctx.fillStyle = ball.speed >= 1400 ? '#ff3c5a' : (ball.speed >= 900 ? '#ffd700' : '#ffffff');
      ctx.textAlign = 'center';
      ctx.fillText(`СКОРОСТЬ: ${Math.floor(ball.speed)} PX/S`, CW / 2, 34);

      ctx.font = 'bold 18px Arial';
      ctx.fillStyle = '#a0b4d2';
      ctx.fillText(`РАЛЛИ: ${rallyCount} | СТАРТ: ${startRally} | РЕКОРД: ${maxRally}`, CW / 2, 64);

      // Экраны меню
      if (state === 'START') {
        ctx.fillStyle = 'rgba(5, 8, 16, 0.85)';
        ctx.fillRect(0, 0, CW, CH);
        ctx.font = '68px Impact';
        ctx.fillStyle = '#ffd700';
        ctx.fillText('FACE PONG: МОБИЛЬНАЯ ВЕРСИЯ', CW / 2, 280);
        ctx.font = '36px Impact';
        ctx.fillStyle = '#00f0ff';
        ctx.fillText('С КАЖДЫМ УДАРОМ ВСЁ БЫСТРЕЕ!', CW / 2, 350);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('👆 КОСНИТЕСЬ ЭКРАНА ДЛЯ СТАРТА', CW / 2, CH - 220);
        ctx.font = 'bold 22px Arial';
        ctx.fillStyle = '#a0b4d2';
        ctx.fillText('Ведите пальцем по экрану, чтобы отбивать мяч!', CW / 2, CH - 160);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(5, 8, 16, 0.9)';
        ctx.fillRect(0, 0, CW, CH);
        ctx.font = '72px Impact';
        ctx.fillStyle = scoreP1 >= 11 ? '#00f0ff' : '#ff3c5a';
        ctx.fillText(scoreP1 >= 11 ? 'ВЫ ПОБЕДИЛИ!' : 'БОТ ПОБЕДИЛ!', CW / 2, CH / 2 - 60);
        ctx.font = '36px Impact';
        ctx.fillStyle = '#ffd700';
        ctx.fillText(`Макс. Ралли: ${maxRally} | Пиковая скорость: ${maxSpeed} px/s`, CW / 2, CH / 2 + 10);
        ctx.fillStyle = '#32ff78';
        ctx.fillText('👆 КОСНИТЕСЬ ДЛЯ РЕВАНША', CW / 2, CH / 2 + 90);
      }

      ctx.restore();
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
